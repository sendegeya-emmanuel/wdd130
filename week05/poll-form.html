<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W05 Learning Activity: HTML Forms | BYU-I</title>
    <meta name="description" content="HTML Form structure and input elements exercise for WDD 130 Week 5.">
    <meta name="author" content="Emmanuel Sendegeya">
</head>
<body>

    <header>
        <p>WDD 130 | HTML Forms Learning Activity</p>
    </header>

    <main>
        <h1>User Browser and Background Poll</h1>
        
        <form action="#" method="get">
            <!-- First Name Field -->
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <!-- User Email Field -->
            <label for="useremail">Email Address:</label>
            <input type="email" id="useremail" name="useremail" required>

            <!-- Favorite Internet Browser Dropdown -->
            <label for="browser">What is your favorite internet browser?</label>
            <select id="browser" name="browser">
                <option value="chrome">Chrome</option>
                <option value="firefox">Firefox</option>
                <option value="edge">Edge</option>
                <option value="brave">Brave</option>
                <option value="other">Other</option>
            </select>

            <!-- Household Pet Checkbox -->
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">

            <!-- Places Lived Textarea Feedback -->
            <label for="feedback">List the places you have lived:</label>
            <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>

            <!-- Submit Form Button -->
            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer>
        <p>&copy;2026 Emmanuel Sendegeya | Bujumbura, Burundi</p>
    </footer>

</body>
</html>
