<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz | WDD 130</title>
    <meta name="description" content="A basic HTML and CSS educational quiz form for WDD 130 Week 5 code-along activity.">
    <meta name="author" content="Emmanuel Sendegeya">
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>

    <header>
        <p>WDD 130 | Web Fundamentals Quiz</p>
    </header>

    <main>
        <!-- Required: Appropriate Heading -->
        <h1>HTML and CSS Basics Quiz</h1>
        
        <form action="#" method="post">
            
            <!-- Question 1: Text type input (Fill in the blank) -->
            <div class="quiz-item">
                <label for="q1">1. What HTML tag is used to define the main structural heading of a page?</label>
                <input type="text" id="q1" name="q1" placeholder="e.g., h1" required>
            </div>

            <!-- Question 2: Textarea element (Short answer) -->
            <div class="quiz-item">
                <label for="q2">2. Explain the main difference between an ID selector and a Class selector in CSS:</label>
                <textarea id="q2" name="q2" rows="4" placeholder="Type your short answer here..." required></textarea>
            </div>

            <!-- Question 3: Select element (Dropdown list) -->
            <div class="quiz-item">
                <label for="q3">3. Which CSS layout method is best suited for small-scale, one-dimensional row layouts?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="flexbox">CSS Flexbox</option>
                    <option value="grid">CSS Grid Layout</option>
                    <option value="floats">CSS Floats</option>
                </select>
            </div>

            <!-- Question 4: Number type input (Integer answer) -->
            <div class="quiz-item">
                <label for="q4">4. How many dimensions does the CSS Grid Layout framework manage simultaneously?</label>
                <input type="number" id="q4" name="q4" min="1" max="4" placeholder="Enter an integer" required>
            </div>

            <!-- Required: Submit button -->
            <button type="submit">Submit Quiz</button>
            
        </form>
    </main>

    <footer>
        <p>&copy;2026 Emmanuel Sendegeya | Bujumbura, Burundi</p>
    </footer>

</body>
</html>
