<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Dry Oar Boating</title>
    <meta name="description" content="Contact Dry Oar Boating for general inquiries, rafting reservations, and website suggestions. Locate our office and meet our team.">
    <meta name="author" content="Emmanuel Sendegeya">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>

    <header>
        <div class="logo-box">
            <!-- FIXED: Correct relative path inside wwr directory context -->
            <img src="images/logo.png" alt="Dry Oar Boating Logo" class="logo">
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main class="contact-main">
        <h1>Contact Dry Oar Boating</h1>

        <!-- Section 1: Company Information & Map -->
        <section class="company-info">
            <div class="info-text">
                <h2>Our Office</h2>
                <p><strong>Address:</strong> 123 Rafting Way, Bujumbura, Burundi</p>
                <p><strong>Phone:</strong> +257 22 22 22 22</p>
                <p><strong>Email:</strong> info@dryoarboating.com</p>
            </div>
            <div class="map-box">
                <!-- FIXED: Replaced standard google link with an official functional Google Maps Embed API URL -->
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d63726.87732046467!2d29.31643742881627!3d-3.3673287776223515!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x19c1830f28a035a3%3A0xfeba9b97b50a4c3!2sBujumbura!5e0!3m2!1sfr!2sbi!4v1791383669756!5m2!1sfr!2sbi" width="600" height="300" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </section>

        <!-- Section 2: Employee Profiles -->
        <section class="employee-section">
            <h2>Meet Our Team</h2>
            <div class="employee-grid">
                <figure class="employee-card">
                    <img src="images/employee1.jpg" alt="Jean-Pierre, Managing Director">
                    <figcaption><strong>Jean-Pierre</strong> <br> Managing Director</figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employee2.jpg" alt="Aline, Senior River Guide">
                    <figcaption><strong>Aline</strong> <br> Senior River Guide</figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employee3.jpg" alt="Fabrice, Safety Coordinator">
                    <figcaption><strong>Fabrice</strong> <br> Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>

        <!-- Section 3: Contact Form -->
        <section class="form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post" class="rafting-form">
                
                <div class="form-group">
                    <label for="username">Full Name:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="useremail">Email Address:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>

                <!-- FIXED: Radio buttons properly grouped with matching name and individual explicit ids -->
                <div class="form-group-radio">
                    <label>Purpose of Message:</label>
                    <div class="radio-options">
                        <label for="general"><input type="radio" id="general" name="purpose" value="general" checked> General Inquiry</label>
                        <label for="reservation"><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
                        <label for="suggestion"><input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <!-- FIXED: Checkbox element with required id and name attributes coupled with a label -->
                <div class="form-group-checkbox">
                    <input type="checkbox" id="pet" name="newsletter" value="subscribe">
                    <label for="pet">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Submit Inquiry</button>
            </form>
        </section>
    </main>

    <!-- FIXED: Footer contains exactly two components, including the required nav class="socialmedia" with 3 images -->
    <footer>
        <p>&copy; 2026 Dry Oar Boating | Emmanuel Sendegeya | WDD 130</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank"><img src="images/facebook.svg" alt="Facebook Icon"></a>
            <a href="https://twitter.com" target="_blank"><img src="images/twitter.svg" alt="Twitter Icon"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram.svg" alt="Instagram Icon"></a>
        </nav>
    </footer>

</body>
</html>
