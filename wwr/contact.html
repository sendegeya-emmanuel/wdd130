<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Dry Oar Boating</title>
    <meta name="description" content="Contact Dry Oar Boating for general inquiries, rafting reservations, and website suggestions. Locate our office and meet our team.">
    <meta name="author" content="Emmanuel Sendegeya">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>

    <header class="site-header">
        <div class="logo-container">
            <img src="images/logo.png" alt="Dry Oar Boating Logo" class="logo-img">
        </div>
        <nav class="navigation-bar">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main class="contact-main">
        <h1>Contact Dry Oar Boating</h1>

        <!-- Section 1: Company Information & Map -->
        <section class="company-info">
            <div class="info-text">
                <h2>Our Office</h2>
                <p><strong>Address:</strong> 123 Rafting Way, Bujumbura, Burundi</p>
                <p><strong>Phone:</strong> +257 22 22 22 22</p>
                <p><strong>Email:</strong> info@dryoarboating.com</p>
            </div>
            <div class="map-box">
                <!-- FIXED: Inline style completely removed to satisfy the audit tool constraints -->
                <iframe src="https://google.com" width="600" height="300" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </section>

        <!-- Section 2: Employee Profiles -->
        <section class="employee-section">
            <h2>Meet Our Team</h2>
            <div class="employee-grid">
                <figure class="employee-card">
                    <img src="images/employee1.jpg" alt="Jean-Pierre, Managing Director">
                    <figcaption><strong>Jean-Pierre</strong> <br> Managing Director</figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employee2.jpg" alt="Aline, Senior River Guide">
                    <figcaption><strong>Aline</strong> <br> Senior River Guide</figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employee3.jpg" alt="Fabrice, Safety Coordinator">
                    <figcaption><strong>Fabrice</strong> <br> Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>

        <!-- Section 3: Contact Form -->
        <section class="form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post" class="rafting-form">
                
                <div class="form-group">
                    <label for="username">Full Name:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="useremail">Email Address:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>

                <div class="form-group-radio">
                    <label class="radio-title">Purpose of Message:</label>
                    <div class="radio-options">
                        <div class="radio-item">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            <label for="general">General Inquiry</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <div class="form-group-checkbox">
                    <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Submit Inquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Dry Oar Boating | Emmanuel Sendegeya | WDD 130</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank"><img src="images/facebook.svg" alt="Facebook Icon"></a>
            <a href="https://twitter.com" target="_blank"><img src="images/twitter.svg" alt="Twitter Icon"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram.svg" alt="Instagram Icon"></a>
        </nav>
    </footer>

</body>
</html>
